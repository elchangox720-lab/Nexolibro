<section class="auth-wrap">
  <div class="auth-card">
    <p class="auth-eyebrow">Bienvenido</p>
    <h1 class="auth-title">Inicia sesión</h1>
    <p class="auth-subtitle">
      Accede para guardar tus favoritos, estados de lectura, reseñas e historial.
    </p>

    <form (ngSubmit)="enviar()">
      <div class="auth-field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="auth-field">
        <label for="password">Contraseña</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          [(ngModel)]="password"
          required
        />
      </div>

      @if (error()) {
        <p class="auth-error">{{ error() }}</p>
      }

      <button class="auth-submit" type="submit" [disabled]="cargando()">
        {{ cargando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <p class="auth-alt">¿No tienes cuenta? <a routerLink="/registro">Crear una</a></p>
  </div>
</section>
