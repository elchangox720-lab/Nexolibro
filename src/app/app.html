<header class="app-header">
  <a class="app-brand" routerLink="/libros">
    <span class="app-brand-mark">N</span>
    <span>Nexolibro</span>
  </a>

  <nav class="app-nav">
    <a routerLink="/libros" routerLinkActive="active" (click)="abrirCatalogo()">Catálogo</a>

    @if (auth.autenticado()) {
      <a routerLink="/historial" routerLinkActive="active">Historial</a>
      <span class="app-user">{{ auth.usuario()?.nombre }}</span>
      <button class="app-btn" type="button" (click)="cerrarSesion()">Salir</button>
    } @else {
      <a routerLink="/login" routerLinkActive="active">Ingresar</a>
      <a class="app-btn-solid" routerLink="/registro">Crear cuenta</a>
    }

    <button
      class="theme-toggle"
      type="button"
      (click)="theme.alternar()"
      [attr.aria-label]="theme.tema() === 'dark' ? 'Activar modo claro' : 'Activar modo oscuro'"
    >
      @if (theme.tema() === 'dark') {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
      }
    </button>
  </nav>
</header>

<main class="app-main">
  <router-outlet />
</main>

<footer class="app-footer">
  Nexolibro · Encuentra tu próxima lectura
</footer>
